name: Build Moonlight

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.scheme }} (iOS, TrollStore IPA)
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            artifact_name: Moonlight-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "warning:|error:|BUILD" || test ${PIPESTATUS[0]} -eq 0

      - name: Dump build log tail to summary
        if: always()
        run: |
          {
            echo "## Build log tail"
            echo '```'
            grep -E "error:|warning:" xcodebuild.log | head -30 || true
            tail -60 xcodebuild.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app bundle integrity
        if: always()
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          echo "APP=$APP"
          {
            echo "## Build output"
            echo '```'
            tail -80 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "CFBundleExecutable=$EXEC"
          if [ ! -f "$APP/$EXEC" ]; then
            echo "::error::Main executable missing from bundle!"
            {
              echo "## Bundle listing"
              echo '```'
              find "$APP" -maxdepth 2 -print
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          file "$APP/$EXEC"
          ls -la "$APP/$EXEC"

      - name: Install ldid
        run: brew install ldid

      - name: Sign with ldid (TrollStore-style, with entitlements)
        run: |
          set -e
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")

          # Entitlements TrollStore apps need
          cat > /tmp/ents.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.no-container</key>
            <false/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Sign nested code first with ldid
          find "$APP" -type d \( -name '*.framework' -o -name '*.appex' \) -print0 | while IFS= read -r -d '' f; do
            echo "ldid signing $f"
            ldid -S /tmp/ents.plist "$f" 2>/dev/null || codesign -s - --force "$f" 2>/dev/null || echo "WARN: could not sign $f"
          done
          find "$APP" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' f; do
            ldid -S /tmp/ents.plist "$f" || true
          done
          # Sign OpenSSL framework binary inside if present
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f ! -name '*.plist' ! -name '*.car' -print0 | while IFS= read -r -d '' f; do
              file "$f" | grep -q Mach-O && ldid -S /tmp/ents.plist "$f" || true
            done
          fi
          # Main executable: ldid generates proper DER + entitlements blob
          ldid -S /tmp/ents.plist "$APP/$EXEC" || {
            echo "ldid failed on main executable, falling back to codesign"
            codesign -s - --force --generate-entitlement-der --entitlements /tmp/ents.plist "$APP/$EXEC"
          }
          echo "== ldid entitlements check =="
          ldid -e "$APP/$EXEC" | head -20
          echo "== codesign structural check =="
          codesign -dv "$APP/$EXEC" 2>&1 | head -6 || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ matrix.artifact_name }}.ipa" Payload
          ls -la "${{ matrix.artifact_name }}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-TrollStore-IPA
          path: ${{ matrix.artifact_name }}.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-buildlog
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Publish IPA + diagnostics to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          mkdir -p pub
          cp "${{ matrix.artifact_name }}.ipa" pub/
          {
            echo "# Build diagnostics"
            echo '```'
            echo "== Bundle listing =="
            find "$APP" -maxdepth 2 -print
            echo "== Bundle ID / Executable in Info.plist =="
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
            echo "== Full Info.plist =="
            /usr/libexec/PlistBuddy -c 'Print' "$APP/Info.plist"
            echo "== Signature identifier (must match CFBundleIdentifier) =="
            codesign -dv --verbose=4 "$APP" 2>&1 | head -25
            echo "== Executable type/size =="
            file "$APP/$EXEC"
            ls -la "$APP/$EXEC"
            echo '```'
          } > pub/diagnostics.md
          cd pub
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "IPA build $GITHUB_RUN_ID"
          gh auth setup-git
          git push -f "https://github.com/KDCJT/moonlight-ios.git" gh-pages:gh-pages
