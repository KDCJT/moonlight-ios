name: Build Moonlight

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.scheme }} (iOS, TrollStore IPA)
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            artifact_name: Moonlight-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log | grep -E "warning:|error:|BUILD" || true

      - name: List build products
        run: find build/Build/Products -maxdepth 3 \( -name '*.app' -o -name '*.ipa' \) -print

      - name: Debug output before anything
        if: always()
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          echo "APP=$APP"
          find "$APP" -print | head -60
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "EXEC=$EXEC"
          file "$APP/$EXEC" || true
          ldid -e "$APP" 2>&1 | head -20 || true

      - name: Ad-hoc sign for TrollStore
        run: |
          set -ex
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          # Sign nested code first, then the bundle itself (ad-hoc, no cert needed)
          find "$APP" -type d \( -name '*.framework' -o -name '*.appex' \) -print0 | while IFS= read -r -d '' f; do
            echo "signing $f"
            codesign -s - --force "$f"
          done
          find "$APP" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' f; do
            echo "signing $f"
            codesign -s - --force "$f"
          done
          codesign -s - --force --generate-entitlement-der "$APP"
          echo "== Verify =="
          codesign -dv "$APP" 2>&1 | head -8
          codesign --verify --deep "$APP" && echo "codesign verify OK"
          {
            echo "## Bundle diagnostics"
            echo '```'
            find "$APP" -maxdepth 2 -print
            file "$APP/$EXEC" || true
            /usr/libexec/PlistBuddy -c 'Print' "$APP/Info.plist" 2>/dev/null | head -40
            codesign -d --entitlements - "$APP" 2>&1 | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found — searching for products:"
            find build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ matrix.artifact_name }}.ipa" Payload
          ls -la "${{ matrix.artifact_name }}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-TrollStore-IPA
          path: ${{ matrix.artifact_name }}.ipa
          if-no-files-found: error

      - name: Publish IPA + diagnostics to gh-pages
        run: |
          set -x
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          mkdir -p pub
          cp "${{ matrix.artifact_name }}.ipa" pub/
          {
            echo "# Build diagnostics"
            echo '```'
            echo "== Bundle listing =="
            find "$APP" -maxdepth 2 -print
            echo "== Executable type =="
            file "$APP/$EXEC"
            echo "== Main binary size =="
            ls -la "$APP/$EXEC"
            echo "== Entitlements =="
            codesign -d --entitlements - --xml "$APP" 2>/dev/null | head -40
            echo "== codesign -dv =="
            codesign -dv "$APP" 2>&1 | head -12
            echo "== deep verify =="
            codesign --verify --deep --verbose=2 "$APP" 2>&1 | head -20
            echo '```'
          } > pub/diagnostics.md
          cd pub
          git init 2>&1
          git checkout -b gh-pages
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "IPA build $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KDCJT/moonlight-ios.git" gh-pages:gh-pages 2>&1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-buildlog
          path: xcodebuild.log
          if-no-files-found: warn
