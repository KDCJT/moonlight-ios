name: Build Moonlight

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.scheme }} (iOS, TrollStore IPA)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            artifact_name: Moonlight-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log | grep -E "warning:|error:|BUILD" || true

      - name: List build products
        run: find build/Build/Products -maxdepth 3 \( -name '*.app' -o -name '*.ipa' \) -print

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found — searching for products:"
            find build/Build/Products -maxdepth 3 -print
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ matrix.artifact_name }}.ipa" Payload
          ls -la "${{ matrix.artifact_name }}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-TrollStore-IPA
          path: ${{ matrix.artifact_name }}.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-buildlog
          path: xcodebuild.log
          if-no-files-found: warn
