name: Build Moonlight

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.scheme }} (iOS, TrollStore IPA)
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Moonlight
            artifact_name: Moonlight-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            build 2>&1 | tee xcodebuild.log | grep -E "warning:|error:|BUILD" || true

      - name: Verify app bundle integrity
        if: always()
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          echo "APP=$APP"
          {
            echo "## Build output"
            echo '```'
            tail -80 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$APP" ] || { echo "::error::no .app produced"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "CFBundleExecutable=$EXEC"
          if [ ! -f "$APP/$EXEC" ]; then
            echo "::error::Main executable missing from bundle!"
            {
              echo "## Bundle listing"
              echo '```'
              find "$APP" -maxdepth 2 -print
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          file "$APP/$EXEC"
          ls -la "$APP/$EXEC"

      - name: Ad-hoc re-sign for TrollStore
        run: |
          set -e
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          # Sign nested code first, then the bundle itself (ad-hoc, no cert needed)
          find "$APP" -type d \( -name '*.framework' -o -name '*.appex' \) -print0 | while IFS= read -r -d '' f; do
            codesign -s - --force "$f"
          done
          find "$APP" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' f; do
            codesign -s - --force "$f"
          done
          codesign -s - --force --generate-entitlement-der "$APP"
          codesign --verify --deep "$APP" && echo "codesign verify OK"

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name '*.app' -type d | head -1)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ matrix.artifact_name }}.ipa" Payload
          ls -la "${{ matrix.artifact_name }}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-TrollStore-IPA
          path: ${{ matrix.artifact_name }}.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-buildlog
          path: xcodebuild.log
          if-no-files-found: warn
